<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انیمه وار | نسخه انتشار</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap');

body{
    margin:0;
    font-family:Vazirmatn;
    direction:rtl;
    background:#05060a;
    color:white;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 20% 20%, #ff2e63, transparent 35%),
    radial-gradient(circle at 80% 20%, #00d4ff, transparent 35%),
    radial-gradient(circle at 50% 80%, #b300ff, transparent 35%),
    radial-gradient(circle at 80% 70%, #ffd000, transparent 35%);
    filter:blur(70px);
    opacity:0.35;
    z-index:-1;
}

h2{margin:10px 0}

.box{
    margin:10px;
    padding:12px;
    border-radius:12px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
}

button{
    margin:5px;
    padding:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    color:white;
    background:linear-gradient(90deg,#ff2e63,#00d4ff,#b300ff,#ffd000);
}

.map{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.zone{
    padding:15px;
    text-align:center;
    border-radius:12px;
    background:rgba(255,255,255,0.05);
    cursor:pointer;
}

.zone:hover{
    box-shadow:0 0 15px #00d4ff;
}

.small{
    font-size:13px;
    opacity:0.8;
}
</style>
</head>

<body>

<div class="box">
<h2>🔥 انیمه وار | RPG انتشار</h2>

<button onclick="setChar('گوجو')">گوجو</button>
<button onclick="setChar('تانجیرو')">تانجیرو</button>
<button onclick="setChar('کافکا')">کافکا</button>
<button onclick="setChar('نزوکو')">نزوکو</button>

<p>کاراکتر: <span id="char">انتخاب نشده</span></p>
<p>XP: <span id="xp">0</span> | لول: <span id="lvl">1</span> | سکه: <span id="coin">20</span></p>
</div>

<div class="box">
<h2>🌍 نقشه جهان</h2>

<div class="map">
<div class="zone" onclick="move('city')">شهر</div>
<div class="zone" onclick="move('forest')">جنگل</div>
<div class="zone" onclick="move('demon')">دنیای شیاطین</div>
<div class="zone" onclick="move('academy')">آکادمی</div>
</div>

<p id="place"></p>
<p id="quest"></p>
</div>

<div class="box">
<h2>🛒 فروشگاه</h2>

<button onclick="buy('شمشیر',10)">شمشیر</button>
<button onclick="buy('زره',15)">زره</button>
<button onclick="buy('معجون',8)">معجون</button>

<div id="inv"></div>
</div>

<div class="box">
<h2>🎯 آزمون قدرت</h2>

<p id="q"></p>
<div id="ans"></div>
<p id="qr"></p>
</div>

<div class="box">
<h2>🎮 مینی‌گیم</h2>
<button onclick="mini()">شروع</button>
<p id="mini"></p>
</div>

<script>

let xp=0,lvl=1,coin=20;
let char="";
let inv=[];
let qIndex=0;

// 👤 CHARACTER
function setChar(c){
char=c;
document.getElementById("char").innerText=c;
}

// 📊 UPDATE SAFE
function update(){
lvl=Math.floor(xp/10)+1;
document.getElementById("xp").innerText=xp;
document.getElementById("lvl").innerText=lvl;
document.getElementById("coin").innerText=coin;
}

// 🌍 MOVE (SAFE + FIXED)
function move(z){

let msg="",quest="";

if(z==="city"){
xp+=10; coin+=5;
msg="وارد شهر شدی";
quest="تمرین قدرت +10 XP";
}

if(z==="forest"){
xp+=7;
msg="جنگل تاریک";
quest="تمرین بقا +7 XP";
}

if(z==="demon"){
let r=Math.random();
if(r>0.5){xp+=15; msg="بردی!";}
else{xp-=5; msg="باختی!";}
quest="نبرد خطرناک";
}

if(z==="academy"){
xp+=12;
msg="آکادمی";
quest="آموزش تکنیک +12 XP";
}

document.getElementById("place").innerText=msg;
document.getElementById("quest").innerText=quest;

update();
}

// 🛒 SHOP SAFE
function buy(item,cost){
if(coin>=cost){
coin-=cost;
inv.push(item);
renderInv();
update();
}
}

function renderInv(){
document.getElementById("inv").innerHTML=
inv.map(i=>"• "+i).join("<br>");
}

// 🎮 MINI GAME SAFE
function mini(){
let arr=["🔥 آتش","⚡ برق","🌊 آب","👁 سایه"];
document.getElementById("mini").innerText=
arr[Math.floor(Math.random()*arr.length)];
xp++;
update();
}

// 🎯 QUIZ SAFE
let quiz=[
["قدرت گوجو؟","Infinity","Fire","Ice",0],
["تانجیرو؟","آب","باد","سنگ",0],
["کافکا؟","کایجو","روح","انسان",0]
];

function loadQ(){

if(qIndex>=quiz.length){
document.getElementById("q").innerText="تمام شد!";
return;
}

let q=quiz[qIndex];

document.getElementById("q").innerText=q[0];

document.getElementById("ans").innerHTML=
q.slice(1,4).map((a,i)=>
`<button onclick="answer(${i})">${a}</button>`
).join("");
}

function answer(i){

if(i===quiz[qIndex][4]){
xp+=10;
document.getElementById("qr").innerText="✔ درست!";
}else{
xp-=3;
document.getElementById("qr").innerText="✖ غلط!";
}

qIndex++;
update();
setTimeout(loadQ,600);
}

loadQ();
update();

</script>

</body>
</html>
